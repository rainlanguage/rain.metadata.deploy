# Mutation probe config for the subgraph deploy record
# (rainlanguage/rain.metadata.deploy#2, recut by rainlanguage/rain.metadata#149).
#
# This repo's share of the subgraph is ONE file — `subgraph/networks.json`, the
# per-network address and start block table. The manifest, schema, mappings and
# matchstick suite are subgraph SOURCE and live in `rain.metadata`, which pins
# the manifest to the interface it indexes; the mutants for that half are in
# that repo, not here.
#
# So the thing under test here is DATA plus the two generated / declared records
# the data is checked against, and the mutants break those rather than the
# concrete's logic: that is where the failure mode lives. A hand-edited address,
# a start block typed on one network and forgotten on the others, a network row
# for a chain this repo never broadcasts to — none of those are reachable by
# mutating Solidity statements, and all of them ship silently without these
# assertions.
#
# `M06` is what the address-agreement assertion missed until the probe asked:
# agreement between the rows that exist says nothing about a row that does not,
# so a name misspelled on one network left four agreeing entries and one
# singleton agreeing with itself.
#
# `M04` is the one that matters most. `LibMetaBoardReleased.releasedSuites()` is
# empty today, so the release-coverage assertion is empty-true and cannot
# demonstrate itself on the committed tree. Putting a release into the record is
# what shows the assertion is armed rather than decorative: it is the same edit
# `cutRelease()` will make at the first `sol-v*` tag.

[suite]
root = "."
command = ["nix", "develop", "--command", "forge", "test"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (\S+)'
timeout-secs = 1800

[[mutants]]
name = "M01 networks.json flare indexes a different address from every other network"
file = "subgraph/networks.json"
target = '''  "flare": {
    "metaboard0": {
      "address": "0xfb8437AeFBB8031064E274527C5fc08e30Ac6928",'''
replacement = '''  "flare": {
    "metaboard0": {
      "address": "0x0000000000000000000000000000000000000001",'''

[[mutants]]
name = "M02 networks.json flare start block reset to genesis"
file = "subgraph/networks.json"
target = '"startBlock": 55347067'
replacement = '"startBlock": 0'

[[mutants]]
name = "M03 networks.json indexes a network this repo does not deploy to"
file = "subgraph/networks.json"
target = '  "flare": {'
replacement = '  "fantom": {'

[[mutants]]
name = "M04 a frozen release exists that the subgraph does not index"
file = "src/lib/LibMetaBoardReleased.sol"
target = '        DeploySuite[] memory suites = new DeploySuite[](0);'
replacement = '''        DeploySuite[] memory suites = new DeploySuite[](1);
        suites[0] = DeploySuite({
            suite: "metaboard@9_9_9",
            creationCode: hex"00",
            storedDeployedAddress: address(0x00000000000000000000000000000000000000A1),
            storedBytecodeHash: bytes32(0),
            storedRuntimeCode: hex"00",
            artifactPath: "src/concrete/MetaBoard.sol:MetaBoard",
            dependencies: new address[](0)
        });'''

[[mutants]]
name = "M05 a network row in networks.json declares no datasource at all"
file = "subgraph/networks.json"
target = '''  "flare": {
    "metaboard0": {
      "address": "0xfb8437AeFBB8031064E274527C5fc08e30Ac6928",
      "startBlock": 55347067
    }
  }'''
replacement = '''  "flare": {}'''

[[mutants]]
name = "M06 a datasource is renamed on one network and vanishes from it"
file = "subgraph/networks.json"
target = '''  "flare": {
    "metaboard0": {'''
replacement = '''  "flare": {
    "metaboard1": {'''
