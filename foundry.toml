# Release metadata, not foundry config. `[external.*]` is the namespace foundry
# reserves for other tools and ignores outright, so it raises no unknown-section
# warning and `forge config --fix` leaves it alone (a section foundry does not
# reserve is read as a profile, warned about on every invocation and rewritten
# into `[profile.*]` by the fixer). `version` is the last-published Soldeer
# release — a deploy repo moves it only via a manual `sol-v*` tag, in lockstep
# with the frozen `src/generated/<tag>/` snapshot it names — and is read here by
# `script/Build.sol`'s `cutRelease()` to locate the snapshot it freezes.
[external.package]
name = "rain-metadata-deploy"
version = "0.1.2"

[profile.default]
src = 'src'
test = 'test'
out = 'out'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

# `MetaBoard`'s deterministic deploy address, runtime codehash and creation
# bytecode are recorded in the generated `src/generated/candidate/MetaBoard.sol`
# snapshot and are a pure function of the creation code, which is a function of
# these settings. They are pinned exactly rather than floated so the record
# cannot move under a compiler or default-target change.
solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false

# The filesystem access in this repo. `script/Build.sol` writes the generated
# candidate snapshot and the generated libs under `src/`, reads the release
# version from this file when `cutRelease()` runs, and stages the regenerated
# network sections of this file and `.env.example` under `.staged-config/` for
# `script/build.sh` to install: foundry refuses a cheatcode write to this file
# whatever is granted here.
# `MetaBoardDeploySnapshotTest`'s inherited frozen-record walk reads
# `src/generated/` too, so tests need the same read access.
# `test/src/subgraph/SubgraphDeployRecord.t.sol` reads the deploy record under
# `./subgraph`. That grant is the directory rather than the one file because
# `.gitignore` already states the boundary — this repo owns `networks.json`
# there and nothing else under it is committed — and read-only, so no Forge
# cheatcode can write into it. That is the whole of what `fs_permissions`
# governs: the deploy workflow drops the fetched subgraph source beside the
# table with its own `cp -R`, which this file has no say over.
fs_permissions = [
  { access = "read", path = "./foundry.toml" },
  { access = "read", path = "./.env.example" },
  { access = "read-write", path = "./.staged-config" },
  { access = "read", path = "./script/build.sh" },
  { access = "read", path = "./subgraph" },
  { access = "read-write", path = "./src" },
]
libs = ["dependencies"]

[fuzz]
runs = 2048

# Behaviour-only view of the test suite, for mutation and coverage campaigns.
# The snapshot and candidate suites tie the generated record to
# `type(MetaBoard).creationCode`, so compiler output moves for any edit to any
# source file reachable from `MetaBoard` and both contracts fail under every
# source mutation, observable or not — a campaign including them scores every
# mutant as killed. This profile drops them and inherits everything else from
# `default`.
[profile.mutation]
no_match_contract = "MetaBoardDeploySnapshotTest|LibMetaBoardDeployCandidateTest|LibMetaBoardDeployTest"

# `recursive_deps` is off, so every package an import resolves through is
# declared here.
[dependencies]
forge-std = "1.17.0"
# `IMetaBoardV1_2`, `IMetaV1_2`, `LibIMetaBoardV1_2` and `LibMeta` — the library
# half `MetaBoard` is nothing but a delegation into.
"rain-metadata" = "0.1.43"
"rain-deploy" = "0.1.20"
# `LibRainDeploySnapshot` — reached from `script/Build.sol` and the shipped
# verify abstracts — emits the generated record via `LibCodeGen`/`LibFs`.
"rain-sol-codegen" = "0.1.39"
# `ICloneableFactoryV4`/`V5` — `rain-deploy`'s `LibRainDeployMechanism` imports
# them under `rain-factory-0.2.4/`.
"rain-factory" = "0.2.4"
# `IBeacon`, `UpgradeableBeacon`, `Ownable2Step` and `IERC5313` — `rain-deploy`'s
# beacon libs import them under `@openzeppelin-contracts-5.7.0/`.
"@openzeppelin-contracts" = "5.7.0"

[soldeer]
recursive_deps = false

# One alias per network `supportedNetworks()` declares, which is what
# `script/Deploy.sol` broadcasts to. Generated by `script/Build.sol` between the
# markers; `Git is clean` fails a tree where they drift.
# rain-deploy:generated:rpc_endpoints:begin
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
bsc = "${BSC_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
flare = "${FLARE_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
# rain-deploy:generated:rpc_endpoints:end

# `rainix-manual-sol-artifacts` passes `--verify` by default and exports exactly
# these variable names. Generated with `[rpc_endpoints]`, from the same
# declaration, so the two cannot name different networks.
# rain-deploy:generated:etherscan:begin
[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}", chain = 42161 }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}", chain = 84532 }
bsc = { key = "${CI_DEPLOY_BSC_ETHERSCAN_API_KEY}", chain = 56 }
ethereum = { key = "${CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY}", chain = 1 }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}", chain = 14 }
hyperevm = { key = "${CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY}", chain = 999 }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}", chain = 137 }
robinhood = { key = "${CI_DEPLOY_ROBINHOOD_ETHERSCAN_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
# rain-deploy:generated:etherscan:end
